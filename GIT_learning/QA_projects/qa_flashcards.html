<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Flashcards — Повторение теории</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Системный шрифт macOS и базовые настройки */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d0d12;
            background-image:
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.12) 0px, transparent 50%);
            color: #f5f5f7;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Контейнер для 3D-перспективы карточки */
        .perspective-1000 {
            perspective: 1200px;
        }

        /* Внутренний блок карточки для вращения */
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        /* Лицевая и обратная стороны карточки */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 24px;
            background: rgba(28, 28, 34, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2.5rem;
            text-align: center;
            user-select: none;
        }

        .card-face-back {
            transform: rotateY(180deg);
            background: rgba(34, 34, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
        }

        /* Стилизация скроллбара для длинных ответов */
        .card-content::-webkit-scrollbar {
            width: 6px;
        }
        .card-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .card-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        /* Анимация появления модального окна */
        @keyframes modalFadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-animate {
            animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-8">

    <!-- Верхняя панель управления (Header) -->
    <header class="w-full max-w-3xl flex items-center justify-between gap-4 mb-4">
        <div class="flex items-center gap-3">
            <!-- Имитация macOS-кнопок окна -->
            <div class="hidden sm:flex items-center gap-1.5 mr-2">
                <span class="w-3 h-3 rounded-full bg-red-500/80"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500/80"></span>
                <span class="w-3 h-3 rounded-full bg-green-500/80"></span>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-semibold tracking-tight text-white">QA Flashcards</h1>
                <p class="text-xs text-zinc-400">Повторение теории тестирования</p>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <!-- Кнопка перемешивания -->
            <button id="shuffleBtn" title="Перемешать карточки" class="p-2.5 rounded-xl bg-zinc-800/80 hover:bg-zinc-700/80 border border-white/10 text-zinc-300 hover:text-white transition active:scale-95 flex items-center gap-2 text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                <span class="hidden sm:inline">Перемешать</span>
            </button>

            <!-- Кнопка "+" для добавления новой карточки -->
            <button id="openModalBtn" title="Добавить новую карточку" class="px-3.5 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-white font-medium transition active:scale-95 flex items-center gap-1.5 shadow-lg shadow-sky-500/20 text-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
                </svg>
                <span>Добавить</span>
            </button>
        </div>
    </header>

    <!-- Основная область с карточкой -->
    <main class="w-full max-w-3xl flex-1 flex flex-col items-center justify-center my-2">

        <!-- Счётчик и прогресс-бар -->
        <div class="w-full flex items-center justify-between text-xs sm:text-sm text-zinc-400 mb-3 px-1">
            <span id="cardCounter" class="font-medium text-zinc-300">Карточка 1 из 27</span>
            <span id="customBadge" class="hidden px-2.5 py-0.5 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30 text-xs">Пользовательская</span>
            <span class="text-zinc-500 hidden sm:inline">Пробел — перевернуть • ← → — листать</span>
        </div>

        <div class="w-full h-1.5 bg-zinc-800/80 rounded-full overflow-hidden mb-6">
            <div id="progressBar" class="h-full bg-gradient-to-r from-sky-400 to-purple-500 transition-all duration-300" style="width: 3.7%;"></div>
        </div>

        <!-- 3D Карточка -->
        <div class="w-full h-[360px] sm:h-[420px] perspective-1000 relative">
            <div id="flashcard" class="card-inner">

                <!-- Лицевая сторона (Вопрос) -->
                <div class="card-face card-face-front">
                    <span class="text-xs uppercase tracking-widest text-sky-400 font-semibold mb-4">Вопрос / Термин</span>
                    <div class="card-content overflow-y-auto max-h-[240px] w-full flex items-center justify-center">
                        <h2 id="cardQuestion" class="text-2xl sm:text-3xl font-semibold text-white leading-snug"></h2>
                    </div>
                    <span class="text-xs text-zinc-500 mt-6">Нажмите на карточку, чтобы увидеть ответ</span>
                </div>

                <!-- Обратная сторона (Ответ) -->
                <div class="card-face card-face-back">
                    <span class="text-xs uppercase tracking-widest text-purple-400 font-semibold mb-4">Ответ / Объяснение</span>
                    <div class="card-content overflow-y-auto max-h-[260px] w-full flex items-center justify-center px-2">
                        <p id="cardAnswer" class="text-base sm:text-lg text-zinc-200 leading-relaxed"></p>
                    </div>

                    <!-- Кнопка удаления (только для пользовательских карточек) -->
                    <button id="deleteCardBtn" class="hidden mt-5 px-3 py-1.5 rounded-lg bg-red-500/15 hover:bg-red-500/25 text-red-400 border border-red-500/20 text-xs font-medium transition flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        Удалить карточку
                    </button>
                </div>

            </div>
        </div>

        <!-- Кнопки навигации -->
        <div class="flex items-center justify-center gap-4 mt-8 w-full">
            <button id="prevBtn" class="flex-1 sm:flex-none sm:w-36 py-3 px-5 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 border border-white/10 text-zinc-200 font-medium transition active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
                </svg>
                <span>Назад</span>
            </button>

            <button id="flipBtn" class="py-3 px-6 rounded-2xl bg-zinc-800/50 hover:bg-zinc-700/60 border border-white/10 text-zinc-300 font-medium transition active:scale-95 text-sm hidden sm:block">
                Перевернуть
            </button>

            <button id="nextBtn" class="flex-1 sm:flex-none sm:w-36 py-3 px-5 rounded-2xl bg-zinc-800/80 hover:bg-zinc-700/80 border border-white/10 text-zinc-200 font-medium transition active:scale-95 flex items-center justify-center gap-2">
                <span>Вперёд</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </button>
        </div>
    </main>

    <!-- Футер -->
    <footer class="w-full max-w-3xl text-center text-xs text-zinc-600 mt-6">
        Все добавленные карточки автоматически сохраняются в вашем браузере
    </footer>

    <!-- Модальное окно добавления новой карточки -->
    <div id="addModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/70 backdrop-blur-sm p-4">
        <div class="modal-animate w-full max-w-md rounded-2xl bg-zinc-900 border border-white/15 shadow-2xl p-6">
            <div class="flex items-center justify-between mb-5">
                <h3 class="text-lg font-semibold text-white">Новая карточка</h3>
                <button id="closeModalBtn" class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <form id="addCardForm" class="space-y-4">
                <div>
                    <label for="newQuestion" class="block text-xs font-medium text-zinc-400 mb-1.5">Вопрос / Термин</label>
                    <input type="text" id="newQuestion" required placeholder="Например: Что такое регрессионное тестирование?"
                        class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-800/90 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm">
                </div>

                <div>
                    <label for="newAnswer" class="block text-xs font-medium text-zinc-400 mb-1.5">Ответ / Объяснение</label>
                    <textarea id="newAnswer" required rows="4" placeholder="Краткий и понятный ответ..."
                        class="w-full px-3.5 py-2.5 rounded-xl bg-zinc-800/90 border border-white/10 text-white placeholder-zinc-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm resize-none"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <button type="button" id="cancelModalBtn" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-sm font-medium transition">
                        Отмена
                    </button>
                    <button type="submit" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium transition shadow-lg shadow-sky-500/20">
                        Сохранить карточку
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Встроенное уведомление (Toast) вместо alert() -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-2.5 rounded-xl bg-zinc-800 border border-white/15 text-white text-sm shadow-xl transform translate-y-16 opacity-0 transition-all duration-300 pointer-events-none">
        Уведомление
    </div>

    <script>
        // Базовый набор из 27 карточек по QA
        const defaultCards = [
            {
                id: 'def-1',
                q: 'Жизненный цикл ПО (SDLC)',
                a: 'Последовательность этапов разработки продукта: Сбор требований → Проектирование → Разработка → Тестирование → Внедрение (релиз) → Поддержка.'
            },
            {
                id: 'def-2',
                q: 'Виды тестирования',
                a: 'Функциональное и нефункциональное (производительность, безопасность, юзабилити); по доступу к коду: чёрный, серый и белый ящик; по уровню: модульное, интеграционное, системное, приёмочное; по цели: дымовое (Smoke), регрессионное, санитарное (Sanity).'
            },
            {
                id: 'def-3',
                q: 'Что такое тест-кейс и как он выглядит',
                a: 'Документ, описывающий шаги для проверки конкретной функции. Состоит из: ID, Названия, Предусловия, Шагов воспроизведения, Ожидаемого результата и (при прохождении) Фактического результата и Статуса.'
            },
            {
                id: 'def-4',
                q: 'Техники тестирования (тест-дизайна)',
                a: 'Способы оптимизации проверок: Эквивалентное разделение, Анализ граничных значений, Таблица принятия решений, Попарное тестирование (Pairwise), Диаграмма состояний и переходов, Предугадывание ошибок.'
            },
            {
                id: 'def-5',
                q: 'Тестирование безопасности: что в себя включает',
                a: 'Поиск уязвимостей и защиту данных: проверка аутентификации и авторизации, защита от инъекций (SQLi, XSS), проверка заголовков безопасности (HSTS, CSP, X-Frame-Options), поиск утечек через API (например, User Enumeration).'
            },
            {
                id: 'def-6',
                q: 'Что такое фронтенд (Frontend)',
                a: 'Клиентская часть приложения, с которой напрямую взаимодействует пользователь в браузере или приложении (вёрстка HTML/CSS, логика интерфейса на JavaScript, кнопки, формы, анимации).'
            },
            {
                id: 'def-7',
                q: 'Что такое бэкенд (Backend)',
                a: 'Серверная часть приложения («под капотом»): обработка бизнес-логики, работа с базами данных, аутентификация, интеграция с внешними сервисами и ответы на API-запросы.'
            },
            {
                id: 'def-8',
                q: 'Методы HTTP-запросов',
                a: 'Основные глаголы для общения с сервером: GET (получить данные), POST (создать), PUT (полностью обновить), PATCH (частично обновить), DELETE (удалить).'
            },
            {
                id: 'def-9',
                q: 'Разница между PUT и PATCH',
                a: 'PUT полностью заменяет ресурс на сервере (нужно передавать все поля), а PATCH обновляет только указанные поля, не затрагивая остальные.'
            },
            {
                id: 'def-10',
                q: 'Статус-коды HTTP: какие есть группы',
                a: '1xx (Информационные), 2xx (Успешные), 3xx (Перенаправления / Редиректы), 4xx (Ошибки клиента), 5xx (Ошибки сервера).'
            },
            {
                id: 'def-11',
                q: 'Что значит код 201',
                a: 'Created — запрос выполнен успешно, и в результате на сервере был создан новый ресурс (часто возвращается на POST-запрос).'
            },
            {
                id: 'def-12',
                q: 'Что значит код 204',
                a: 'No Content — запрос выполнен успешно, но в теле ответа нет данных для возврата (часто используется при DELETE-запросах).'
            },
            {
                id: 'def-13',
                q: 'Что значит код 301',
                a: 'Moved Permanently — запрашиваемый ресурс навсегда перенесён на новый URL-адрес (постоянный редирект).'
            },
            {
                id: 'def-14',
                q: 'Что значит код 400',
                a: 'Bad Request — сервер не может обработать запрос из-за синтаксической ошибки, неверного формата JSON или отсутствия обязательных параметров со стороны клиента.'
            },
            {
                id: 'def-15',
                q: 'Что значит код 401',
                a: 'Unauthorized — для доступа к ресурсу требуется аутентификация (пользователь не залогинен или передан неверный/просроченный токен).'
            },
            {
                id: 'def-16',
                q: 'Что значит код 403',
                a: 'Forbidden — сервер понял запрос, пользователь аутентифицирован, но у него недостаточно прав доступа к этому ресурсу.'
            },
            {
                id: 'def-17',
                q: 'Что значит код 404',
                a: 'Not Found — запрашиваемый ресурс или страница не найдены на сервере.'
            },
            {
                id: 'def-18',
                q: 'Что значит код 500',
                a: 'Internal Server Error — внутренняя ошибка сервера; на стороне бэкенда произошло непредвиденное исключение, которое он не смог обработать.'
            },
            {
                id: 'def-19',
                q: 'Что значит код 502',
                a: 'Bad Gateway — сервер, выступающий в роли шлюза или прокси (например, Nginx или Cloudflare), получил некорректный ответ от вышестоящего сервера.'
            },
            {
                id: 'def-20',
                q: 'Что значит код 504',
                a: 'Gateway Timeout — шлюз или прокси-сервер не дождался ответа от вышестоящего сервера в установленное время (таймаут).'
            },
            {
                id: 'def-21',
                q: 'Что такое вкладка Elements (в DevTools)',
                a: 'Инструмент для просмотра и редактирования DOM-дерева (HTML) и CSS-стилей страницы в реальном времени.'
            },
            {
                id: 'def-22',
                q: 'Что такое вкладка Console (в DevTools)',
                a: 'Инструмент для просмотра логов, ошибок JavaScript и предупреждений, а также для выполнения JS-кода прямо на странице.'
            },
            {
                id: 'def-23',
                q: 'Что такое вкладка Network (в DevTools)',
                a: 'Инструмент для отслеживания всех сетевых запросов браузера: статус-коды, время ответа, заголовки (Headers), тело запросов и ответов.'
            },
            {
                id: 'def-24',
                q: 'Что такое вкладка Collection (в Postman)',
                a: 'Папка для организации, группировки и хранения сохранённых API-запросов по проектам или модулям, которую можно запускать целиком (Collection Runner).'
            },
            {
                id: 'def-25',
                q: 'Что такое CRUD',
                a: 'Четыре базовые операции с данными в БД и API: Create (создание — POST), Read (чтение — GET), Update (обновление — PUT/PATCH), Delete (удаление — DELETE).'
            },
            {
                id: 'def-26',
                q: 'Что такое CI/CD',
                a: 'Continuous Integration / Continuous Delivery (Deployment) — практика автоматической сборки, прогона автотестов и выкатки нового кода на сервер при каждом изменении в репозитории.'
            },
            {
                id: 'def-27',
                q: 'В чем разница между аутентификацией и авторизацией',
                a: 'Аутентификация — это проверка «кто ты?» (вход по логину/паролю или токену). Авторизация — это проверка «что тебе можно делать?» (проверка прав доступа и ролей).'
            }
        ];

        const STORAGE_KEY = 'qa_flashcards_custom_v1';
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;

        // DOM-элементы
        const flashcardEl = document.getElementById('flashcard');
        const questionEl = document.getElementById('cardQuestion');
        const answerEl = document.getElementById('cardAnswer');
        const counterEl = document.getElementById('cardCounter');
        const progressBarEl = document.getElementById('progressBar');
        const customBadgeEl = document.getElementById('customBadge');
        const deleteCardBtn = document.getElementById('deleteCardBtn');

        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const flipBtn = document.getElementById('flipBtn');
        const shuffleBtn = document.getElementById('shuffleBtn');

        const addModal = document.getElementById('addModal');
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const cancelModalBtn = document.getElementById('cancelModalBtn');
        const addCardForm = document.getElementById('addCardForm');
        const newQuestionInput = document.getElementById('newQuestion');
        const newAnswerInput = document.getElementById('newAnswer');
        const toastEl = document.getElementById('toast');

        // Загрузка карточек (базовые + пользовательские из localStorage)
        function loadCards() {
            try {
                const savedCustom = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
                cards = [...defaultCards, ...savedCustom];
            } catch (e) {
                cards = [...defaultCards];
            }
        }

        // Сохранение пользовательских карточек в localStorage
        function saveCustomCards() {
            try {
                const customOnly = cards.filter(c => c.isCustom);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(customOnly));
            } catch (e) {
                showToast('Не удалось сохранить в память браузера');
            }
        }

        // Отрисовка текущей карточки
        function renderCard() {
            if (cards.length === 0) return;

            const current = cards[currentIndex];

            // Сброс переворота при переключении
            isFlipped = false;
            flashcardEl.classList.remove('is-flipped');

            // Небольшая задержка обновления текста обратной стороны, чтобы при перевороте не мелькал старый ответ
            questionEl.textContent = current.q;
            setTimeout(() => {
                answerEl.textContent = current.a;
            }, 100);

            // Обновление счётчика и прогресс-бара
            counterEl.textContent = `Карточка ${currentIndex + 1} из ${cards.length}`;
            const progress = ((currentIndex + 1) / cards.length) * 100;
            progressBarEl.style.width = `${progress}%`;

            // Бейдж и кнопка удаления для пользовательских карточек
            if (current.isCustom) {
                customBadgeEl.classList.remove('hidden');
                deleteCardBtn.classList.remove('hidden');
            } else {
                customBadgeEl.classList.add('hidden');
                deleteCardBtn.classList.add('hidden');
            }
        }

        // Переворот карточки
        function toggleFlip() {
            isFlipped = !isFlipped;
            flashcardEl.classList.toggle('is-flipped', isFlipped);
        }

        // Навигация
        function nextCard() {
            currentIndex = (currentIndex + 1) % cards.length;
            renderCard();
        }

        function prevCard() {
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            renderCard();
        }

        // Перемешивание (алгоритм Фишера — Йетса)
        function shuffleCards() {
            for (let i = cards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cards[i], cards[j]] = [cards[j], cards[i]];
            }
            currentIndex = 0;
            renderCard();
            showToast('Карточки перемешаны');
        }

        // Показ всплывающего уведомления
        function showToast(message) {
            toastEl.textContent = message;
            toastEl.classList.remove('translate-y-16', 'opacity-0');
            setTimeout(() => {
                toastEl.classList.add('translate-y-16', 'opacity-0');
            }, 2500);
        }

        // Управление модальным окном
        function openModal() {
            addModal.classList.remove('hidden');
            addModal.classList.add('flex');
            newQuestionInput.focus();
        }

        function closeModal() {
            addModal.classList.add('hidden');
            addModal.classList.remove('flex');
            addCardForm.reset();
        }

        // Обработчики событий
        flashcardEl.addEventListener('click', (e) => {
            // Игнорируем клик, если нажали на кнопку удаления внутри карточки
            if (e.target.closest('#deleteCardBtn')) return;
            toggleFlip();
        });

        flipBtn.addEventListener('click', toggleFlip);
        nextBtn.addEventListener('click', nextCard);
        prevBtn.addEventListener('click', prevCard);
        shuffleBtn.addEventListener('click', shuffleCards);

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        cancelModalBtn.addEventListener('click', closeModal);

        // Закрытие модалки по клику на фон
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) closeModal();
        });

        // Добавление новой карточки
        addCardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = newQuestionInput.value.trim();
            const a = newAnswerInput.value.trim();
            if (!q || !a) return;

            const newCard = {
                id: 'custom-' + Date.now(),
                q,
                a,
                isCustom: true
            };

            cards.push(newCard);
            saveCustomCards();
            currentIndex = cards.length - 1;
            renderCard();
            closeModal();
            showToast('Карточка добавлена');
        });

        // Удаление пользовательской карточки
        deleteCardBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const current = cards[currentIndex];
            if (!current || !current.isCustom) return;

            cards.splice(currentIndex, 1);
            saveCustomCards();
            if (currentIndex >= cards.length) {
                currentIndex = Math.max(0, cards.length - 1);
            }
            renderCard();
            showToast('Карточка удалена');
        });

        // Горячие клавиши (Пробел, Стрелки, Escape)
        document.addEventListener('keydown', (e) => {
            // Не перехватываем клавиши, если открыто модальное окно
            if (!addModal.classList.contains('hidden')) {
                if (e.key === 'Escape') closeModal();
                return;
            }

            if (e.code === 'Space') {
                e.preventDefault();
                toggleFlip();
            } else if (e.key === 'ArrowRight') {
                nextCard();
            } else if (e.key === 'ArrowLeft') {
                prevCard();
            }
        });

        // Инициализация при загрузке
        window.onload = () => {
            loadCards();
            renderCard();
        };
    </script>
</body>
</html>
